<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
:root{--bg:var(--matopt-bg,#07080c);--tx:var(--matopt-text,#e8e8ee);--mu:var(--matopt-muted,#9aa0b0);--bd:var(--matopt-border,#2a2e3a)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.4 system-ui,sans-serif}
#wrap{display:flex;flex-direction:column;gap:8px;padding:8px}
canvas{width:100%;height:auto;display:block;border-radius:8px;background:#000}
#note{color:var(--mu);font-size:11px}
#ctrls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
label{display:block;color:var(--mu);font-size:11px;margin-bottom:2px}
.c{display:flex;align-items:center;gap:6px}
.c span{font-variant-numeric:tabular-nums;color:var(--tx);min-width:3.2em;text-align:right}
input[type=range]{width:100%;accent-color:#f0a046}
</style></head><body>
<div id="wrap">
  <canvas id="c" width="720" height="420"></canvas>
  <div id="ctrls">
    <div><label for="mass">Apparent mass</label><div class="c"><input id="mass" type="range" min="0.4" max="2.0" step="0.05"><span id="v-mass">1.00</span></div></div>
    <div><label for="spin">Disk rotation speed</label><div class="c"><input id="spin" type="range" min="0" max="2" step="0.05"><span id="v-spin">0.60</span></div></div>
    <div><label for="tilt">Viewing angle (deg)</label><div class="c"><input id="tilt" type="range" min="0" max="70" step="1"><span id="v-tilt">10</span></div></div>
  </div>
  <div id="note">Cinematic illustration inspired by the Interstellar black hole — artist's rendering, not a relativistic ray trace.</div>
</div>
<script>
(function(){
  var M = window.matopt || {};
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var S = {mass:1.0, spin:0.6, tilt:10};   /* tilt in DEGREES */
  var ids = ['mass','spin','tilt'];
  var stars = [];
  var seed = 1234567;
  function rnd(){ seed = (seed*1664525 + 1013904223) >>> 0; return seed/4294967296; }
  for (var i=0;i<320;i++) stars.push({x:rnd()*720, y:rnd()*420, r:0.4+rnd()*1.3, z:0.3+rnd()*0.7, t:rnd()*6.283});

  var fmt = {mass:function(v){return v.toFixed(2);}, spin:function(v){return v.toFixed(2);}, tilt:function(v){return v.toFixed(0);}};

  function label(id){ return document.getElementById('v-'+id); }
  function paint(id,v){ label(id).textContent = fmt[id](v); }
  function push(id,v){ var o={}; o[id]=v; if(M.setState) M.setState(o); }

  function bind(id){
    var el = document.getElementById(id);
    el.value = S[id]; paint(id, S[id]);
    el.addEventListener('input', function(){
      var v = parseFloat(el.value);
      S[id] = v;
      paint(id, v);
      push(id, v);
      if(reduced) redraw();
    });
  }
  ids.forEach(bind);

  if(M.onStateChange){
    M.onStateChange(function(st){
      if(!st) return;
      var changed = false;
      ids.forEach(function(id){
        var v = st[id];
        if(typeof v === 'number' && isFinite(v) && v !== S[id]){
          S[id] = v;
          document.getElementById(id).value = v;
          paint(id, v);
          changed = true;
        }
      });
      if(changed && reduced) redraw();
    });
  }

  function draw(t){
    var W = cv.width, H = cv.height, cx = W*0.5, cy = H*0.5;
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
    var m = S.mass, spin = S.spin, tiltRad = S.tilt*Math.PI/180;
    var Rs = 46*m;                        /* shadow radius */
    var cs = Math.cos(tiltRad), sn = Math.sin(tiltRad);
    var flat = 0.10 + 0.55*sn;            /* disk vertical compression */

    /* star field with slight parallax on mass */
    for (var i=0;i<stars.length;i++){
      var s = stars[i];
      var px = cx + (s.x-cx)*(1+ (m-1)*0.08);
      var py = cy + (s.y-cy)*(1+ (m-1)*0.08);
      var a = 0.35+0.65*s.z;
      ctx.fillStyle = 'rgba(255,255,255,'+a.toFixed(3)+')';
      ctx.beginPath(); ctx.arc(px,py,s.r*s.z,0,6.283); ctx.fill();
    }

    /* accretion disk back half (behind shadow) */
    function disk(part, alpha){
      ctx.save();
      ctx.beginPath(); ctx.rect(0,0,W,H);
      if(part==='back') ctx.rect(0,0,W,cy); else ctx.rect(0,cy,W,H);
      ctx.clip();
      var R0 = Rs*1.25, R1 = Rs*3.6;
      for(var k=0;k<34;k++){
        var ph = k/34;
        var ang = ph*6.283 + t*spin*0.9*(0.35+ph);
        var rr = R0 + (R1-R0)*(ph);
        var w = 0.35 + 0.65*Math.cos(ph*6.283*3 + t*spin*1.6);
        if(w<=0.02) continue;
        var x = cx + rr*Math.cos(ang);
        var y = cy + rr*Math.sin(ang)*flat - Rs*0.08*cs;
        var rad = (3 + 5*(1-ph))*(0.6+0.4*w);
        var g = ctx.createRadialGradient(x,y,0,x,y,rad*2.2);
        var hot = Math.max(0,1-ph);
        g.addColorStop(0,'rgba(255,'+Math.round(200+55*hot)+','+Math.round(140+90*hot)+','+(alpha*(0.25+0.6*w)).toFixed(3)+')');
        g.addColorStop(1,'rgba(180,60,10,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(x,y,rad*2.2,0,6.283); ctx.fill();
      }
      ctx.restore();
    }
    disk('back', 0.95);

    /* shadow */
    var sg = ctx.createRadialGradient(cx,cy,Rs*0.6,cx,cy,Rs);
    sg.addColorStop(0,'#000'); sg.addColorStop(0.92,'#000'); sg.addColorStop(1,'rgba(0,0,0,0.92)');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(cx,cy,Rs,0,6.283); ctx.fill();

    /* photon ring */
    ctx.save();
    ctx.shadowColor = 'rgba(255,190,120,0.9)'; ctx.shadowBlur = 14;
    ctx.strokeStyle = 'rgba(255,235,200,0.95)'; ctx.lineWidth = 1.6 + 0.8*m;
    ctx.beginPath(); ctx.arc(cx,cy,Rs*1.02,0,6.283); ctx.stroke();
    ctx.restore();

    /* front of disk (over shadow) */
    disk('front', 0.85);

    /* lensed top arc above shadow */
    ctx.save();
    ctx.strokeStyle = 'rgba(255,210,150,0.55)'; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(cx, cy - Rs*0.06, Rs*1.30, Math.PI*1.12, Math.PI*1.88); ctx.stroke();
    ctx.restore();
  }

  var running=false, last=0, elapsed=0, throttle=0, rafId=0;
  function frame(ts){
    if(!running) return;
    if(!last) last = ts;
    var dt = Math.min((ts-last)/1000, 0.1);   /* capped frame delta */
    last = ts;
    elapsed += dt;                            /* cumulative animation time */
    throttle += dt;
    if(throttle >= 0.033){ draw(elapsed); throttle = 0; }
    rafId = requestAnimationFrame(frame);
  }
  function start(){ if(running||reduced) return; running=true; last=0; throttle=0; rafId=requestAnimationFrame(frame); }
  function stop(){ running=false; if(rafId){ cancelAnimationFrame(rafId); rafId=0; } last=0; throttle=0; }
  function redraw(){ draw(elapsed); }

  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ stop(); } else { start(); }
  });
  window.addEventListener('resize', redraw);

  draw(elapsed);   /* elapsed = 0 initially */
  if(!reduced) start();
})();
</script>
</body></html>
