# MatOpt — docker compose
# Usage:
#   docker compose up --build        # build & start everything
#   docker compose up -d             # detached
#   docker compose logs -f backend   # tail backend logs
#   docker compose down              # stop & remove

services:
  # ── Backend (FastAPI + Python) ──────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: matopt-backend
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/data
      - ./skills:/app/skills:ro
    environment:
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - DATA_DIR=/app/data
      - SKILLS_DIRS=/app/skills/matopt,/app/skills/lambda,/app/skills/anthropic
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Frontend (Nginx serving Vite build) ─────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_UI_SANDBOX_ORIGIN: ${UI_SANDBOX_ORIGIN:-}
    container_name: matopt-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      UI_SANDBOX_ORIGIN: ${UI_SANDBOX_ORIGIN:-}
    depends_on:
      backend:
        condition: service_healthy
      ui-sandbox:
        condition: service_started

  # Isolated static origin for generated HTML/JS, with no backend/workspace access.
  ui-sandbox:
    build:
      context: .
      dockerfile: frontend/sandbox/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:80"

volumes:
  backend-data:
