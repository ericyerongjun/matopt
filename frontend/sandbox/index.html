<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MatOpt isolated interactive output</title>
  <style>
    :root { --matopt-bg: #fff; --matopt-text: #171717; --matopt-muted: #6b6b6b; --matopt-border: #e5e5e5; --matopt-control: #f1f1f1; color-scheme: light; font-family: -apple-system-body, ui-sans-serif, -apple-system, system-ui, "Segoe UI", Helvetica, Arial, sans-serif; color: var(--matopt-text); background: var(--matopt-bg); }
    :root[data-theme="dark"] { --matopt-bg: #212121; --matopt-text: #ececec; --matopt-muted: #a6a6a6; --matopt-border: #3d3d3d; --matopt-control: #2f2f2f; color-scheme: dark; }
    body { margin: 0; padding: 16px; box-sizing: border-box; }
    *, *::before, *::after { box-sizing: inherit; }
    button, input, select, textarea { font: inherit; }
    :focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
  <script src="/runtime.js" defer></script>
</head>
<body><p role="status">Loading interactive output…</p></body>
</html>
